<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Who is this? Bingo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#2F4A3A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light; /* one deliberate light look in the host's palette */
    --deep-sage: #2F4A3A;
    --poster-sage: #4C6A51;
    --off-white: #F2EEEA;
    --terracotta: #C4622D;
    --brown: #493430;
    --line: rgba(73, 52, 48, 0.18);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--off-white);
    color: var(--deep-sage);
    font-family: "DM Sans", system-ui, sans-serif;
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding-block: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  header { text-align: center; margin-bottom: 8px; }
  .eyebrow {
    font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--poster-sage); font-weight: 700; margin: 0 0 6px;
  }
  h1 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 800;
    font-size: clamp(40px, 11vw, 72px);
    line-height: .95;
    margin: 0;
    color: var(--deep-sage);
  }
  h1 em { font-style: italic; font-weight: 500; color: var(--terracotta); }
  .how {
    margin: 6px auto 0; max-width: 460px;
    font-size: 12px; line-height: 1.4; color: var(--brown); opacity: .85;
  }

  .how b { font-weight: 700; color: var(--deep-sage); }
  .how .prize { color: var(--terracotta); font-weight: 700; }
  .status {
    display: flex; justify-content: flex-start; gap: 6px;
    margin: 12px 2px 6px;
    font-size: 12px; color: var(--brown);
  }
  .pill + .pill::before { content: "·"; margin-right: 6px; opacity: .6; }
  .pill b { font-weight: 700; }
  .pill.bingo { color: var(--terracotta); font-weight: 700; }

  .board {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-auto-rows: 1fr; /* every box the same height */
    gap: 4px;
    background: var(--brown);
    padding: 4px;
    border-radius: 12px;
    box-shadow: 0 14px 34px rgba(73,52,48,.22);
  }
  .cell {
    position: relative;
    min-height: 78px;
    background: #fff;
    color: var(--brown);
    border: 0;
    border-radius: 8px;
    padding: 6px 5px;
    gap: 6px;
    font: inherit;
    text-align: left;
    cursor: pointer;
    display: flex; flex-direction: column; justify-content: space-between;
    overflow: hidden;
    transition: transform .12s ease, background .2s ease;
  }
  .cell.free {
    background: var(--deep-sage); color: var(--off-white);
    align-items: center; justify-content: center; text-align: center;
    cursor: default;
    font-family: "Fraunces", Georgia, serif; font-weight: 800;
    font-size: clamp(12px, 3.2vw, 18px); letter-spacing: .04em;
  }
  .cell.free.in-line { background: var(--terracotta); }
  .cell:active { transform: scale(.96); }
  .cell:focus-visible { outline: 3px solid var(--terracotta); outline-offset: 2px; }
  .bio {
    font-size: clamp(9px, 2.3vw, 12px);
    line-height: 1.25;
    overflow-wrap: break-word;
    hyphens: auto;
  }
  .name {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: clamp(10px, 2.4vw, 14px);
    line-height: 1.1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cell .name:empty::before {
    content: "+ who?";
    font-family: "DM Sans", system-ui, sans-serif;
    font-weight: 500; font-size: clamp(9px, 2vw, 12px);
    color: var(--poster-sage); opacity: .8;
  }
  .cell.filled { background: var(--poster-sage); color: var(--off-white); }
  .cell.filled .bio { opacity: .7; }
  .cell.in-line { background: var(--terracotta); }
  .cell.pop { animation: pop .5s ease; }
  @keyframes pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.08) rotate(-2deg); }
    100% { transform: scale(1); }
  }

  .footer {
    display: flex; justify-content: center; align-items: center;
    margin-top: 8px; font-size: 12px; color: var(--brown); opacity: .8; gap: 12px;
  }
  .credit {
    text-align: center; margin: 14px 0 0;
    font-size: 11px; letter-spacing: .04em;
    color: var(--brown); opacity: .55;
  }
  .credit a { color: inherit; text-decoration: none; }

  /* Answer sheet */
  .scrim {
    position: fixed; inset: 0; background: rgba(20, 30, 24, .6);
    display: none; align-items: flex-end; justify-content: center;
    z-index: 20;
  }
  .scrim.open { display: flex; }
  @media (min-width: 600px) { .scrim { align-items: center; } }
  .sheet {
    background: var(--off-white); color: var(--brown);
    width: 100%; max-width: 480px;
    border-radius: 20px 20px 0 0;
    padding: 22px 20px calc(22px + env(safe-area-inset-bottom));
    animation: up .22s ease;
  }
  @media (min-width: 600px) { .sheet { border-radius: 20px; } }
  @keyframes up { from { transform: translateY(30px); opacity: 0; } }
  .sheet .label {
    font-size: 12px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--poster-sage); font-weight: 700; margin: 0 0 8px;
  }
  .sheet blockquote {
    margin: 0 0 18px;
    font-family: "Fraunces", Georgia, serif;
    font-style: italic; font-weight: 500;
    font-size: 20px; line-height: 1.35;
    border-left: 4px solid var(--terracotta);
    padding-left: 12px;
    word-break: break-word;
  }
  .sheet input {
    width: 100%;
    font: inherit; font-size: 18px;
    padding: 13px 14px;
    border: 2px solid var(--line);
    border-radius: 12px;
    background: #fff; color: var(--brown);
  }
  .sheet input:focus { outline: none; border-color: var(--poster-sage); }
  .sheet .saved { font-size: 13px; color: var(--poster-sage); height: 18px; margin: 6px 2px 0; }
  .actions { display: flex; gap: 10px; margin-top: 12px; }
  .btn {
    flex: 1; border: 0; border-radius: 12px;
    padding: 14px; font: inherit; font-weight: 700; font-size: 16px; cursor: pointer;
  }
  .btn.primary { background: var(--deep-sage); color: var(--off-white); }
  .btn.ghost { background: transparent; color: var(--brown); border: 2px solid var(--line); flex: 0 0 auto; padding: 14px 18px; }

  /* BINGO celebration */
  .celebrate {
    position: fixed; inset: 0; z-index: 30;
    display: none; align-items: center; justify-content: center;
    background: rgba(47, 74, 58, .94);
    color: var(--off-white);
    padding: 16px;
    cursor: pointer;
  }
  .celebrate.show { display: flex; animation: fadein .15s ease; }
  .celebrate.hiding { animation: fadeout .3s ease forwards; }
  @keyframes fadein { from { opacity: 0; } }
  @keyframes fadeout { to { opacity: 0; } }
  .card {
    text-align: center; max-width: 420px;
    animation: zoom .35s cubic-bezier(.2, 1.6, .4, 1);
  }
  @keyframes zoom { from { transform: scale(.3) rotate(-8deg); opacity: 0; } }
  .letters { display: flex; justify-content: center; gap: 6px; margin-bottom: 18px; }
  .letters span {
    font-family: "Fraunces", Georgia, serif; font-weight: 800;
    font-size: clamp(44px, 14vw, 76px);
    width: 1.25em; height: 1.25em; line-height: 1.25em;
    background: var(--terracotta); color: var(--off-white);
    border-radius: 14px;
    display: inline-block;
    animation: bounce .4s ease both;
    box-shadow: 0 6px 0 var(--brown);
  }
  .letters span:nth-child(2) { animation-delay: .04s; background: var(--off-white); color: var(--deep-sage); }
  .letters span:nth-child(3) { animation-delay: .08s; }
  .letters span:nth-child(4) { animation-delay: .12s; background: var(--off-white); color: var(--deep-sage); }
  .letters span:nth-child(5) { animation-delay: .16s; }
  @keyframes bounce {
    0% { transform: translateY(-60px); opacity: 0; }
    60% { transform: translateY(8px); opacity: 1; }
    100% { transform: translateY(0); }
  }
  .card p { margin: 0 0 6px; font-size: 18px; line-height: 1.4; }
  .card .sub { opacity: .85; font-size: 15px; }
  .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 31; overflow: hidden; }
  .confetti i {
    position: absolute; top: -20px; width: 10px; height: 14px; border-radius: 2px;
    animation: fall linear forwards;
  }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Indonesian Creators in Singapore</p>
    <h1>Who is <em>this?</em></h1>
    <p class="how">Each box is someone's IG bio. <b>Tap a box</b> to add their name!<br><span class="prize">Winners get prizes! 🎁</span></p>
  </header>

  <div class="status">
    <span class="pill"><b id="found">0</b>/<span id="total">27</span> found</span>
    <span class="pill" id="bingoPill"><b id="bingos">0</b> bingo</span>
  </div>

  <div class="board" id="board" role="grid" aria-label="Bingo board"></div>

  <div class="footer">
    <span>✓ Answers save automatically on this device</span>
  </div>
  <p class="credit"><a href="https://instagram.com/hey.mickmok" target="_blank" rel="noopener">@hey.mickmok</a> 2026</p>
</div>

<div class="scrim" id="scrim">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetLabel">
    <p class="label" id="sheetLabel">Whose bio is this?</p>
    <blockquote id="sheetBio"></blockquote>
    <input id="nameInput" type="text" maxlength="40" placeholder="Type their name" autocomplete="off" autocapitalize="words" enterkeyhint="done">
    <p class="saved" id="savedNote"></p>
    <div class="actions">
      <button class="btn ghost" id="clearOne">Clear</button>
      <button class="btn primary" id="done">Done</button>
    </div>
  </div>
</div>

<div class="celebrate" id="celebrate">
  <div class="card">
    <div class="letters"><span>B</span><span>I</span><span>N</span><span>G</span><span>O</span></div>
    <p id="celebrateTitle">You got a BINGO!</p>
    <p class="sub" id="celebrateSub">Keep going — can you get another line?</p>
  </div>
</div>
<div class="confetti" id="confetti"></div>

<script>
/* =========================================================
   ✏️ EDIT HERE: put 25 Instagram bios below (one per box).
   Keep each one short — about one sentence works best.
   ========================================================= */
const BIOS = [
  "Orthopaedic & Spine Surgeon, Singapore",
  "Career Insider & Your Singapore Bestie",
  "sharing my culture & life story like it’s Netflix",
  "Your fav Singapore insider big sister",
  "Investment Analyst di Singapore",
  "Kelas Mentoring Persiapan ASEAN Scholarship ke SG",
  "Orang Indonesi yang kerja di Singapore",
  "Side questing in 🏃‍♂️ Running & ✈️ Traveling",
  "Noticing the world around us, and within us",
  "🎬 Indonesian Actress",
  "@shelovespartee🏌🏻‍♀️| SG travel tips📕✈️",
  "Radio DJ @capital958fm 8-11 PM",
  "Help families get into top China & SG schools",
  "What Indonesian eats in SG",
  "Keluarga Indonesia di Singapura",
  "Functional Health Practitioner. Helping individuals with Autism, ADHD, learning",
  "Creating relatable, aesthetic content",
  "Sharing my daily cooking",
  "Your SG family guide to parenting + education",
  "Braces & Clear Aligners Specialist",
  "Sharing all you need to know to survive in Singapore.",
  "On career pivots and being a good enough Muslim.",
  "Journeying through life thru entrepreneurship & travel.",
  "Training communication for managers @solidacademy.co",
  "Selling homes | ERA Top Achiever",
  "Running @anya.active | Building @byk.lista",
  "Help you build your Personal Brand inside out",
];

const STORE_KEY = "who-is-this-bingo-v2";
const COLS = 5, ROWS = 6, SLOTS = COLS * ROWS;
const FREE = "__FREE__"; // leftover boxes (30 - number of bios) become FREE spaces

let state = load();
let openIndex = null;

function load() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) {}
  if (!s || typeof s !== "object") s = {};
  s.answers = s.answers && typeof s.answers === "object" ? s.answers : {};
  s.celebrated = Number(s.celebrated) || 0;
  // Each player gets their own shuffled board, kept the same when they come back.
  const valid = Array.isArray(s.order) && s.order.length === SLOTS &&
                BIOS.every(b => s.order.includes(b)) &&
                s.order.every(b => b === FREE || BIOS.includes(b));
  if (!valid) s.order = newOrder();
  return s;
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
}
function newOrder() {
  const slots = BIOS.slice(0, SLOTS);
  while (slots.length < SLOTS) slots.push(FREE);
  return shuffle(slots);
}
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const board = document.getElementById("board");
const TOTAL = BIOS.length;
document.getElementById("total").textContent = TOTAL;
const cells = [];

function build() {
  board.innerHTML = "";
  cells.length = 0;
  state.order.forEach((bio, i) => {
    const btn = document.createElement("button");
    btn.type = "button";
    if (bio === FREE) {
      btn.className = "cell free";
      btn.textContent = "FREE ★";
      btn.tabIndex = -1;
      btn.setAttribute("aria-label", "Free space");
    } else {
      btn.className = "cell";
      btn.innerHTML = '<span class="bio"></span><span class="name"></span>';
      btn.querySelector(".bio").textContent = bio;
      btn.addEventListener("click", () => openSheet(i));
    }
    board.appendChild(btn);
    cells.push(btn);
  });
  render();
}

function isFilled(i) {
  if (state.order[i] === FREE) return true;
  return !!(state.answers[state.order[i]] || "").trim();
}

function completedLines() {
  const lines = [];
  for (let r = 0; r < ROWS; r++) {
    const idx = [...Array(COLS)].map((_, c) => r * COLS + c);
    if (idx.every(isFilled)) lines.push(idx);
  }
  for (let c = 0; c < COLS; c++) {
    const idx = [...Array(ROWS)].map((_, r) => r * COLS + c);
    if (idx.every(isFilled)) lines.push(idx);
  }
  return lines;
}

function render() {
  const lines = completedLines();
  const inLine = new Set(lines.flat());
  let found = 0;
  cells.forEach((cell, i) => {
    if (state.order[i] === FREE) { cell.classList.toggle("in-line", inLine.has(i)); return; }
    const name = (state.answers[state.order[i]] || "").trim();
    if (name) found++;
    cell.querySelector(".name").textContent = name;
    cell.classList.toggle("filled", !!name);
    cell.classList.toggle("in-line", inLine.has(i));
    cell.setAttribute("aria-label", state.order[i] + (name ? ". Answer: " + name : ". Not answered yet"));
  });
  document.getElementById("found").textContent = found;
  document.getElementById("bingos").textContent = lines.length;
  document.getElementById("bingoPill").lastChild.textContent = lines.length === 1 ? " bingo" : " bingos";
  document.getElementById("bingoPill").classList.toggle("bingo", lines.length > 0);
  return lines;
}

/* ---------- answer sheet ---------- */
const scrim = document.getElementById("scrim");
const nameInput = document.getElementById("nameInput");
const savedNote = document.getElementById("savedNote");
let saveTimer;

function openSheet(i) {
  openIndex = i;
  document.getElementById("sheetBio").textContent = "“" + state.order[i] + "”";
  nameInput.value = state.answers[state.order[i]] || "";
  savedNote.textContent = "";
  scrim.classList.add("open");
  setTimeout(() => nameInput.focus(), 50);
}
function closeSheet() {
  if (openIndex === null) return;
  commit();
  const i = openIndex;
  openIndex = null;
  scrim.classList.remove("open");
  nameInput.blur();
  if (isFilled(i)) {
    cells[i].classList.remove("pop"); void cells[i].offsetWidth; cells[i].classList.add("pop");
  }
  checkBingo();
}
function commit() {
  if (openIndex === null) return;
  const v = nameInput.value.trim();
  const key = state.order[openIndex];
  if (v) state.answers[key] = v; else delete state.answers[key];
  save();
  render();
}

nameInput.addEventListener("input", () => {
  commit(); // auto-save every keystroke
  clearTimeout(saveTimer);
  savedNote.textContent = "Saved ✓";
  saveTimer = setTimeout(() => (savedNote.textContent = ""), 1200);
});
nameInput.addEventListener("keydown", e => { if (e.key === "Enter") closeSheet(); });
document.getElementById("done").addEventListener("click", closeSheet);
document.getElementById("clearOne").addEventListener("click", () => {
  nameInput.value = ""; commit(); nameInput.focus();
});
scrim.addEventListener("click", e => { if (e.target === scrim) closeSheet(); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if (openIndex !== null) closeSheet(); else hideCelebrate(); }
});

/* ---------- BINGO! ---------- */
const celebrate = document.getElementById("celebrate");

function checkBingo() {
  const n = completedLines().length;
  const full = state.order.every((_, i) => isFilled(i));
  const newFull = full && !state.full;
  state.full = full;
  if (n > state.celebrated || newFull) {
    state.celebrated = n;
    save();
    showCelebrate(n);
  } else if (n < state.celebrated) {
    state.celebrated = n; // answer was cleared; allow re-celebrating later
    save();
  } else save();
}

function showCelebrate(n) {
  const found = state.order.filter((b, i) => b !== FREE && isFilled(i)).length;
  const title = document.getElementById("celebrateTitle");
  const sub = document.getElementById("celebrateSub");
  if (found === TOTAL) {
    title.textContent = "FULL CARD! You found everyone 🎉";
    sub.textContent = "Legend. You officially know the whole room.";
  } else if (n === 1) {
    title.textContent = "You got your first BINGO!";
    sub.textContent = "Nice! Don't stop now — can you get a second line?";
  } else if (n === 2) {
    title.textContent = "Double BINGO! 🔥";
    sub.textContent = "Two lines down. Go meet a few more people!";
  } else {
    title.textContent = n + " BINGOs! You're on a roll";
    sub.textContent = "Only " + (TOTAL - found) + " left to fill the whole card. Keep going!";
  }
  clearTimeout(hideTimer); clearTimeout(fadeTimer);
  celebrate.classList.remove("show", "hiding"); void celebrate.offsetWidth;
  celebrate.classList.add("show");
  confetti();
  if (navigator.vibrate) navigator.vibrate([60, 40, 120]);
  hideTimer = setTimeout(hideCelebrate, 2700); // gone by 3s, no tap needed
}
let hideTimer, fadeTimer;
function hideCelebrate() {
  if (!celebrate.classList.contains("show")) return;
  clearTimeout(hideTimer);
  celebrate.classList.add("hiding");
  fadeTimer = setTimeout(() => celebrate.classList.remove("show", "hiding"), 300);
}
celebrate.addEventListener("click", hideCelebrate);

function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const box = document.getElementById("confetti");
  const colors = ["#C4622D", "#F2EEEA", "#4C6A51", "#493430"];
  for (let k = 0; k < 90; k++) {
    const p = document.createElement("i");
    p.style.left = Math.random() * 100 + "vw";
    p.style.background = colors[k % colors.length];
    p.style.animationDuration = 1.4 + Math.random() * 1.2 + "s";
    p.style.animationDelay = Math.random() * 0.3 + "s";
    p.style.transform = "rotate(" + Math.random() * 360 + "deg)";
    box.appendChild(p);
    setTimeout(() => p.remove(), 3000);
  }
}


build();
</script>
</body>
</html>
